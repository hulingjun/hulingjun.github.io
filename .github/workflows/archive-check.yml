name: Validate growth archive
on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/github-art-gallery]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install isolated image processing tools
        run: npm install --prefix "$RUNNER_TEMP/gallery-tools" --no-package-lock --no-save sharp@0.35.4
      - name: Prepare verified garden assets
        run: node scripts/prepare-garden-assets.mjs
        env:
          GALLERY_TOOLS_DIR: ${{ runner.temp }}/gallery-tools
      - name: Validate records, permissions and image processing
        run: node --test scripts/archive.test.mjs scripts/seasons.test.mjs
        env:
          GALLERY_TOOLS_DIR: ${{ runner.temp }}/gallery-tools
      - name: Build empty archive fixture
        run: |
          node scripts/build-gallery.mjs
          node scripts/sync-records.mjs
          npm run build
        env:
          GALLERY_TOOLS_DIR: ${{ runner.temp }}/gallery-tools
          GALLERY_FIXTURE: scripts/fixtures/empty.json
      - name: Check published routes and public data
        run: |
          test -s github-dist/index.html
          test -s github-dist/art/index.html
          test -s github-dist/learning/index.html
          test -s github-dist/knowledge/index.html
          test -s github-dist/3d-alpha/index.html
          test -s github-dist/art-data/manifest.json
          test -s github-dist/records/index.json
      - name: Install isolated cloud browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/gallery-tools" --no-package-lock --no-save sharp@0.35.4 playwright@1.63.0
          "$RUNNER_TEMP/gallery-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check realistic seasons, attachments and camera interactions in cloud Chromium
        run: node scripts/garden-browser-check.mjs
        env:
          GALLERY_TOOLS_DIR: ${{ runner.temp }}/gallery-tools
      - name: Compare full-detail performance with the previous release
        run: node scripts/garden-performance-check.mjs
        env:
          GALLERY_TOOLS_DIR: ${{ runner.temp }}/gallery-tools
      - name: Save visual review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garden-visual-review
          path: garden-qa
          retention-days: 7
